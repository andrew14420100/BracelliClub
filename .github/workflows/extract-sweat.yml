# Extracts the uploaded Sweat theme archive into the repository root.
name: Extract Sweat theme

on:
  push:
    paths:
      - '.github/workflows/extract-sweat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Sweat theme into repository root
        shell: bash
        run: |
          set -euo pipefail
          test -f sweat.zip || { echo "sweat.zip not found"; exit 1; }
          rm -rf /tmp/sweat-theme
          mkdir -p /tmp/sweat-theme
          unzip -q sweat.zip -d /tmp/sweat-theme
          test -d /tmp/sweat-theme/sweat || { echo "Expected sweat/ directory not found in archive"; exit 1; }
          cp -a /tmp/sweat-theme/sweat/. ./
          rm -f sweat.zip

      - name: Commit extracted theme
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Extract Sweat WordPress theme"
          git push
