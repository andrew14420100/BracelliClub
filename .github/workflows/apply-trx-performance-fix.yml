name: Apply ThemeREX performance fix

on:
  push:
    paths:
      - '.github/workflows/apply-trx-performance-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch functions.php
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('functions.php')
          text = p.read_text(encoding='utf-8')
          marker = "if ( ! defined( 'SWEAT_CHILD_URL' ) ) {\n\tdefine( 'SWEAT_CHILD_URL', trailingslashit( get_stylesheet_directory_uri() ) );\n}\n"
          snippet = r'''

// Performance safeguard for ThemeREX Addons.
// Disable per-request site visit statistics, which otherwise read, sort and rewrite
// the full visits cache on every frontend request.
if ( ! function_exists( 'sweat_disable_trx_addons_visit_statistics' ) ) {
	function sweat_disable_trx_addons_visit_statistics( $enabled ) {
		return false;
	}
	add_filter( 'trx_addons_filter_save_site_visits', 'sweat_disable_trx_addons_visit_statistics', 1 );
}

// Remove the existing ThemeREX visits cache once after deploying this safeguard.
if ( ! function_exists( 'sweat_clear_trx_addons_visit_cache_once' ) ) {
	function sweat_clear_trx_addons_visit_cache_once() {
		if ( get_option( 'sweat_trx_visits_cache_cleared', '0' ) === '1' ) {
			return;
		}
		if ( function_exists( 'trx_addons_cache_delete_storage' ) ) {
			trx_addons_cache_delete_storage( 'trx_addons_site_visits' );
			update_option( 'sweat_trx_visits_cache_cleared', '1', false );
		}
	}
	add_action( 'init', 'sweat_clear_trx_addons_visit_cache_once', 1 );
}
'''
          if 'sweat_disable_trx_addons_visit_statistics' in text:
              print('ThemeREX performance safeguard already present; no patch needed.')
          else:
              if marker not in text:
                  raise SystemExit('Expected constants marker not found in functions.php')
              text = text.replace(marker, marker + snippet, 1)
              p.write_text(text, encoding='utf-8')
              print('Patched functions.php')
          PY

      - name: Validate PHP syntax
        run: php -l functions.php

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-trx-performance-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Disable costly ThemeREX visit statistics"
          git push
