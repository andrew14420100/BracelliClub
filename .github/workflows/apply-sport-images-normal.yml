name: Normalize sport page images

on:
  push:
    paths:
      - '.github/workflows/apply-sport-images-normal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove opacity and filters from sport images
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("style.css"); t=p.read_text(encoding="utf-8"); marker="BRACELLI SPORT IMAGES - NORMAL OPACITY"; block="\n\n/* BRACELLI SPORT IMAGES - NORMAL OPACITY\n   Keep all images on single sport/service pages fully visible and unfiltered. */\nbody.single-cpt_services .page_content_wrap img,\nbody.single-cpt_services .content_wrap img,\nbody.single-cpt_services .content img,\nbody.single-cpt_services .elementor img,\nbody.single-cpt_services figure img,\nbody.single-cpt_services .post_featured img,\nbody.single-cpt_services .sc_services_item_thumb img,\nbody.single-cpt_services .wp-block-image img {\n    opacity: 1 !important;\n    filter: none !important;\n    -webkit-filter: none !important;\n    mix-blend-mode: normal !important;\n}\n\nbody.single-cpt_services .elementor-widget-image,\nbody.single-cpt_services figure,\nbody.single-cpt_services .post_featured,\nbody.single-cpt_services .sc_services_item_thumb,\nbody.single-cpt_services .wp-block-image {\n    opacity: 1 !important;\n    filter: none !important;\n    -webkit-filter: none !important;\n}\n"; p.write_text(t if marker in t else t+block, encoding="utf-8")'

      - name: Verify CSS override
        run: grep -n 'BRACELLI SPORT IMAGES - NORMAL OPACITY' style.css

      - name: Commit change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-sport-images-normal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Remove opacity from sport page images'
          git push
