name: Show all services archive items

on:
  push:
    paths:
      - '.github/workflows/apply-services-archive-all.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch functions.php
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'sweat_show_all_services_archive' functions.php; then
            echo 'Archive fix already present'
          else
            echo '' | base64 -d >> functions.php
          fi

      - name: Validate PHP
        run: php -l functions.php

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-services-archive-all.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Show all sports in Services archive'
          git push
