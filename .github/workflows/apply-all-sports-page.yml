name: Show all sports on sports page

on:
  push:
    paths:
      - '.github/workflows/apply-all-sports-page.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch functions.php
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'sweat_show_all_services_on_sports_page' functions.php; then
            echo 'All-sports filter already present'
          else
            echo '' | base64 -d >> functions.php
          fi

      - name: Validate PHP syntax
        run: php -l functions.php

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-all-sports-page.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Show all sports on I nostri sport page'
          git push
