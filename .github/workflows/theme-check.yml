name: Theme compatibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        shell: bash
        run: |
          set -o pipefail
          errors=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count+1))
            output=$(php -l "$file" 2>&1) || {
              echo "::error file=$file::$output"
              errors=$((errors+1))
            }
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          echo "Checked $count PHP files on PHP ${{ matrix.php }}"
          if [ "$errors" -ne 0 ]; then
            echo "$errors PHP files failed syntax validation"
            exit 1
          fi

  javascript-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -o pipefail
          errors=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count+1))
            output=$(node --check "$file" 2>&1) || {
              echo "::error file=$file::$output"
              errors=$((errors+1))
            }
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          echo "Checked $count JavaScript files"
          if [ "$errors" -ne 0 ]; then
            echo "$errors JavaScript files failed syntax validation"
            exit 1
          fi

  compatibility-scan:
    name: Legacy PHP compatibility scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan common removed/deprecated PHP patterns
        shell: bash
        run: |
          echo '=== create_function ==='
          grep -RIn --include='*.php' -E '\bcreate_function\s*\(' . || true
          echo '=== PHP each() ==='
          grep -RIn --include='*.php' -E '[^_.[:alnum:]]each\s*\(' . || true
          echo '=== mysql_* ==='
          grep -RIn --include='*.php' -E '\bmysql_[a-zA-Z0-9_]+\s*\(' . || true
          echo '=== utf8_(en|de)code ==='
          grep -RIn --include='*.php' -E '\butf8_(encode|decode)\s*\(' . || true
          echo '=== FILTER_SANITIZE_STRING ==='
          grep -RIn --include='*.php' -E 'FILTER_SANITIZE_STRING' . || true
          echo '=== dynamic property candidates ($this->...) ==='
          grep -RIn --include='*.php' -E '\$this->[A-Za-z_][A-Za-z0-9_]*\s*=' . | head -200 || true

  wordpress-smoke:
    name: WordPress ${{ matrix.wordpress }} / PHP 8.2 runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.9.8', '7.0.5', '7.1.1']
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout theme
        uses: actions/checkout@v4

      - name: Setup PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: wp-cli

      - name: Install WordPress and activate Sweat
        shell: bash
        run: |
          set -euo pipefail
          THEME_DIR="$GITHUB_WORKSPACE"
          WP_DIR="$RUNNER_TEMP/wordpress"
          mkdir -p "$WP_DIR"
          wp core download --path="$WP_DIR" --version="${{ matrix.wordpress }}" --force --allow-root
          wp config create \
            --path="$WP_DIR" \
            --dbname=wordpress \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1:3306 \
            --skip-check \
            --allow-root
          cat >> "$WP_DIR/wp-config.php" <<'PHP'
          
define( 'WP_DEBUG', true );
define( 'WP_DEBUG_LOG', true );
define( 'WP_DEBUG_DISPLAY', false );
@ini_set( 'display_errors', 0 );
PHP
          wp core install \
            --path="$WP_DIR" \
            --url=http://127.0.0.1:8080 \
            --title='Sweat CI' \
            --admin_user=admin \
            --admin_password='ci-password-12345' \
            --admin_email=ci@example.com \
            --skip-email \
            --allow-root
          mkdir -p "$WP_DIR/wp-content/themes/sweat"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            "$THEME_DIR/" "$WP_DIR/wp-content/themes/sweat/"
          wp theme activate sweat --path="$WP_DIR" --allow-root
          wp post create --path="$WP_DIR" --post_type=page --post_title='Smoke Test Page' --post_status=publish --post_content='Theme runtime smoke test.' --porcelain --allow-root

      - name: Request frontend pages with debug logging
        shell: bash
        run: |
          set -euo pipefail
          WP_DIR="$RUNNER_TEMP/wordpress"
          wp server --path="$WP_DIR" --host=127.0.0.1 --port=8080 > "$RUNNER_TEMP/wp-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fSs http://127.0.0.1:8080/ -o "$RUNNER_TEMP/home.html"
          curl -fSs 'http://127.0.0.1:8080/?page_id=2' -o "$RUNNER_TEMP/page.html" || true
          test -s "$RUNNER_TEMP/home.html"
          echo "Home response bytes: $(wc -c < "$RUNNER_TEMP/home.html")"
          echo '=== WordPress debug.log ==='
          if [ -f "$WP_DIR/wp-content/debug.log" ]; then
            cat "$WP_DIR/wp-content/debug.log"
          else
            echo '(no debug.log created)'
          fi
          echo '=== PHP server log ==='
          cat "$RUNNER_TEMP/wp-server.log" || true

      - name: Fail on PHP runtime errors from theme request
        shell: bash
        run: |
          set -euo pipefail
          WP_DIR="$RUNNER_TEMP/wordpress"
          combined="$RUNNER_TEMP/runtime-errors.log"
          : > "$combined"
          [ ! -f "$WP_DIR/wp-content/debug.log" ] || cat "$WP_DIR/wp-content/debug.log" >> "$combined"
          [ ! -f "$RUNNER_TEMP/wp-server.log" ] || cat "$RUNNER_TEMP/wp-server.log" >> "$combined"
          if grep -Ei 'PHP (Fatal error|Parse error|Warning|Deprecated|Notice)|Uncaught (Error|Exception)' "$combined"; then
            echo 'Runtime PHP errors/warnings were detected while rendering the theme.'
            exit 1
          fi
          echo 'No PHP runtime errors/warnings detected in smoke requests.'
