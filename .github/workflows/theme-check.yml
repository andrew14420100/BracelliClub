name: Theme compatibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        shell: bash
        run: |
          set -o pipefail
          errors=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count+1))
            output=$(php -l "$file" 2>&1) || {
              echo "::error file=$file::$output"
              errors=$((errors+1))
            }
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
          echo "Checked $count PHP files on PHP ${{ matrix.php }}"
          if [ "$errors" -ne 0 ]; then
            echo "$errors PHP files failed syntax validation"
            exit 1
          fi

  javascript-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -o pipefail
          errors=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count+1))
            output=$(node --check "$file" 2>&1) || {
              echo "::error file=$file::$output"
              errors=$((errors+1))
            }
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          echo "Checked $count JavaScript files"
          if [ "$errors" -ne 0 ]; then
            echo "$errors JavaScript files failed syntax validation"
            exit 1
          fi

  compatibility-scan:
    name: Legacy PHP compatibility scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan common removed/deprecated PHP patterns
        shell: bash
        run: |
          echo '=== create_function ==='
          grep -RIn --include='*.php' -E '\bcreate_function\s*\(' . || true
          echo '=== each() ==='
          grep -RIn --include='*.php' -E '\beach\s*\(' . || true
          echo '=== mysql_* ==='
          grep -RIn --include='*.php' -E '\bmysql_[a-zA-Z0-9_]+\s*\(' . || true
          echo '=== utf8_(en|de)code ==='
          grep -RIn --include='*.php' -E '\butf8_(encode|decode)\s*\(' . || true
          echo '=== FILTER_SANITIZE_STRING ==='
          grep -RIn --include='*.php' -E 'FILTER_SANITIZE_STRING' . || true
          echo '=== dynamic property candidates ($this->...) ==='
          grep -RIn --include='*.php' -E '\$this->[A-Za-z_][A-Za-z0-9_]*\s*=' . | head -200 || true
